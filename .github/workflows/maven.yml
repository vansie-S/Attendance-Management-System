
name: Attendance Backend CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          cache-dependency-path: attendance-backend/attendance-backend/pom.xml

      - name: Verify Maven wrapper
        run: |
          ls -la attendance-backend/attendance-backend/
          test -f attendance-backend/attendance-backend/mvnw
          test -f attendance-backend/attendance-backend/pom.xml

      - name: Build and run tests
        run: |
          chmod +x attendance-backend/attendance-backend/mvnw
          attendance-backend/attendance-backend/mvnw -B -f attendance-backend/attendance-backend/pom.xml clean test


     
